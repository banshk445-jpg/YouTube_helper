<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>유튜브 AI 도우미</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      padding: 22px;
      font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #f4f5fb;
      color: #333;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .logo-icon { font-size: 32px; }

    .logo-text h1 { font-size: 16px; font-weight: 800; }
    .logo-text p  { font-size: 12px; color: #888; margin-top: 2px; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 7px;
    }

    input[type="password"] {
      width: 100%;
      padding: 11px 13px;
      border: 2px solid #ddd;
      border-radius: 11px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
      background: #fff;
    }

    input[type="password"]:focus { border-color: #667eea; }

    .save-btn {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 11px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .save-btn:hover { opacity: 0.9; }

    .status {
      display: none;
      margin-top: 10px;
      text-align: center;
      font-size: 13px;
      color: #28a745;
      font-weight: 600;
    }

    .info-box {
      margin-top: 16px;
      padding: 13px 15px;
      background: #e8f0fe;
      border-radius: 12px;
      font-size: 13px;
      color: #444;
      line-height: 1.55;
    }

    .info-box strong { color: #667eea; }

    .divider {
      height: 1px;
      background: #e4e4e4;
      margin: 16px 0;
    }

    .key-link {
      font-size: 12px;
      color: #888;
      text-align: center;
      display: block;
    }
    .key-link a { color: #667eea; text-decoration: none; }
    .key-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="logo">
    <span class="logo-icon">🤖</span>
    <div class="logo-text">
      <h1>유튜브 AI 도우미</h1>
      <p>Gemini API 설정</p>
    </div>
  </div>

  <label for="api-key">Gemini API 키</label>
  <input type="password" id="api-key" placeholder="AIza..." autocomplete="off" />
  <button class="save-btn" id="save-btn">저장하기</button>
  <div class="status" id="status">✓ 저장되었습니다!</div>

  <div class="divider"></div>

  <div class="info-box">
    유튜브에서 화면 오른쪽 아래의
    <strong>"도움받기 🤖"</strong> 버튼을 누르면
    AI가 원하는 버튼을 직접 가리켜 드립니다.
  </div>

  <div class="divider"></div>

  <span class="key-link">
    API 키가 없으신가요?
    <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio에서 무료 발급받기</a>
  </span>

  <script src="popup.js"></script>
</body>
</html>
